name: Build & Push Backend to GHCR

on:
  push:
    branches: [ "main" ]
    paths:
      # Chỉ kích hoạt khi có thay đổi trong thư mục backend hoặc workflow
      - "backend/**"
      - ".github/workflows/backend-cicd.yml"
  workflow_dispatch: # Cho phép bấm nút "Run workflow" thủ công trên web GitHub bất cứ lúc nào

env:
  REGISTRY: ghcr.io
  # Chuyển tên repository thành chữ thường để chuẩn quy tắc Docker
  IMAGE_NAME: giakhangcode/erp-backend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 1. Checkout source code
        uses: actions/checkout@v4

      - name: 2. Thiết lập Docker Buildx (hỗ trợ cache siêu nhanh)
        uses: docker/setup-buildx-action@v3

      - name: 3. Đăng nhập vào GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # Sử dụng token mặc định có sẵn của GitHub Actions (không cần cấu hình thủ công)
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 4. Tạo metadata & Tags tự động
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=v-,format=short

      - name: 5. Build và Push Docker Image lên GHCR
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
